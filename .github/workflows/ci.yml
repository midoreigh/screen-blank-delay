name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  lint-and-build:
    name: Lint and Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin gnome-shell gettext

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Shexli static analyzer
        run: |
          python -m pip install --upgrade pip
          pip install shexli

      - name: Compile GSettings schemas
        run: |
          glib-compile-schemas --strict schemas/

      - name: Package GNOME Shell extension
        run: |
          make package

      - name: Run Shexli static analyzer
        run: |
          shexli screen-blank-delay@midoreigh.shell-extension.zip
