name: Release Extension Package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build and Attach Release Asset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libglib2.0-bin \
            gnome-shell \
            gettext

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Shexli static analyzer
        run: |
          python -m pip install --upgrade pip
          pip install "tree-sitter==0.25.2" shexli

      - name: Compile schemas and package extension
        run: |
          make package
          shexli screen-blank-delay@midoreigh.shell-extension.zip

      - name: Upload zip to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: screen-blank-delay@midoreigh.shell-extension.zip
